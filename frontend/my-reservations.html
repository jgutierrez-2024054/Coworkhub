<title>CoWork Hub - Mis reservas</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="brand">CoworkHub</div>
  <nav id="nav"></nav>
  <button id="themeToggle" class="theme-toggle">
    <img src="img/claro.png" alt="Modo claro" />
  </button>
</header>
<main>
  <h1>Mis reservas</h1>
  <div id="alertBox"></div>

  <div class="card">
    <h3>Consumo de este mes</h3>
    <p id="consumoText" style="color:var(--text-muted);">Cargando...</p>
  </div>

  <div class="card">
    <h3>Historial</h3>
    <table>
      <thead>
        <tr><th>Espacio</th><th>Inicio</th><th>Fin</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody id="reservationsBody"></tbody>
    </table>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  window.PAGE = 'my-reservations';
  const alertBox = document.getElementById('alertBox');
  let currentUser = null;

  function fmt(dateStr) {
    return new Date(dateStr).toLocaleString('es-GT', { dateStyle: 'medium', timeStyle: 'short' });
  }

  async function loadConsumo() {
    const now = new Date();
    const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    try {
      const data = await api.reportConsumo(currentUser.id, month);
      document.getElementById('consumoText').textContent =
        `${data.horas} horas reservadas · Q${data.monto.toFixed(2)} este mes`;
    } catch (err) {
      document.getElementById('consumoText').textContent = 'No se pudo cargar el consumo.';
    }
  }

  async function loadReservations() {
    const reservations = await api.myReservations();
    const body = document.getElementById('reservationsBody');
    body.innerHTML = reservations.map(r => `
      <tr>
        <td>${r.space?.name ?? r.spaceId}</td>
        <td>${fmt(r.startsAt)}</td>
        <td>${fmt(r.endsAt)}</td>
        <td><span class="badge ${r.status}">${r.status === 'active' ? 'Activa' : 'Cancelada'}</span></td>
        <td>${r.status === 'active' ? `<button class="danger" data-id="${r.id}">Cancelar</button>` : ''}</td>
      </tr>
    `).join('') || '<tr><td colspan="5" style="color:var(--text-muted)">Aún no tienes reservas.</td></tr>';

    body.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        clearAlert(alertBox);
        try {
          await api.cancelReservation(btn.dataset.id);
          await loadReservations();
          await loadConsumo();
        } catch (err) {
          showAlert(alertBox, err.message || 'No se pudo cancelar.');
        }
      });
    });
  }

  (async () => {
    currentUser = await guardPage({ requireAuth: true });
    if (!currentUser) return;
    await loadReservations();
    await loadConsumo();
  
    // Service worker deshabilitado completamente para evitar problemas de cache
    // if ('serviceWorker' in navigator) {
    //   navigator.serviceWorker.register('service-worker.js')

    //       console.log('[SW] Service Worker registrado:', registration.scope);
    //       
    //       if (registration.waiting) {
    //         registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    //       }
    //       
    //       registration.addEventListener('updatefound', () => {
    //         const newWorker = registration.installing;
    //         newWorker.addEventListener('statechange', () => {
    //           if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
    //             console.log('[SW] Nueva versión disponible');
    //           }
    //         });
    //       });
    //     })
    //     .catch((err) => {
    //       console.error('[SW] Error registrando service worker:', err);
    //     });
    // } else {
    //   console.warn('[SW] Service Worker no soportado en este navegador');
    // }

    initThemeToggle();
  })();
</script>
</body>
</html>
