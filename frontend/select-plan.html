<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CoworkHub" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
<title>CoWork Hub - Seleccionar Plan</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="brand">CoworkHub</div>
  <nav id="nav"></nav>
  <button id="themeToggle" class="theme-toggle">
    <img src="img/claro.png" alt="Modo claro" />
  </button>
</header>
<main>
  <div style="text-align: center; margin-bottom: var(--space-8);">
    <h1 style="font-size: 2rem; color: var(--text-primary); margin-bottom: var(--space-3);">Selecciona tu plan</h1>
    <p style="color: var(--text-secondary); font-size: 1rem; margin: 0;">Elige un plan para comenzar a usar CoworkHub</p>
  </div>

  <div id="alertBox"></div>

  <div class="grid" id="plansGrid"></div>

  <div class="card" style="text-align: center; margin-top: var(--space-8);">
    <h3 style="color: var(--text-muted); margin-bottom: var(--space-3);">¿Prefieres empezar sin plan?</h3>
    <p style="color: var(--text-secondary); font-size: 0.9375rem; margin-bottom: var(--space-4);">
      Podrás reservar escritorios libremente. Para reservar salas de reuniones o eventos, necesitarás adquirir un plan.
    </p>
    <button 
      onclick="skipPlan()" 
      class="secondary"
    >
      Continuar sin plan
    </button>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  window.PAGE = 'select-plan';
  const alertBox = document.getElementById('alertBox');

  async function loadPlans() {
    try {
      const plans = await api.plans();
      const grid = document.getElementById('plansGrid');
      
      if (plans.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align: center;">No hay planes disponibles. Contacta a un administrador.</p>';
        return;
      }

      grid.innerHTML = plans.map(p => `
        <div class="card" style="display: flex; flex-direction: column; height: 100%;">
          <h3 style="color: var(--primary); margin-bottom: var(--space-2);">${p.name}</h3>
          <p class="price" style="margin: var(--space-2) 0;">
            Q${Number(p.price).toFixed(2)}
            <span>/mes</span>
          </p>
          <div style="margin: var(--space-4) 0; flex: 1;">
            <p style="color: var(--text-muted); margin-bottom: var(--space-2);">
              <strong>${p.includedHours} horas</strong> incluidas/mes
            </p>
            <p style="color: var(--text-muted); margin-bottom: var(--space-2);">
              Espacios permitidos:
            </p>
            <ul style="color: var(--text-secondary); margin: 0; padding-left: var(--space-5);">
              ${p.allowedSpaceTypes.map(type => {
                const typeNames = {
                  'desk': 'Escritorio',
                  'meeting_room': 'Sala de reuniones',
                  'event_room': 'Sala de eventos'
                };
                return `<li style="margin-bottom: var(--space-1);">${typeNames[type] || type}</li>`;
              }).join('')}
            </ul>
          </div>
          <button 
            onclick="selectPlan(${p.id})" 
            style="margin-top: var(--space-4); width: 100%;"
          >
            Elegir este plan
          </button>
        </div>
      `).join('');
    } catch (err) {
      showAlert(alertBox, err.message || 'No se pudieron cargar los planes.');
    }
  }

  async function selectPlan(planId) {
    clearAlert(alertBox);
    try {
      await api.selectPlan(planId);
      showAlert(alertBox, 'Plan seleccionado correctamente. Redirigiendo...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    } catch (err) {
      showAlert(alertBox, err.message || 'No se pudo seleccionar el plan.');
    }
  }

  function skipPlan() {
    window.location.href = 'index.html';
  }

  (async () => {
    const user = await guardPage({ requireAuth: true, skipPlanCheck: true });
    if (!user) return;
    
    // Si ya tiene plan, redirigir a index.html
    if (user.plan) {
      window.location.href = 'index.html';
      return;
    }
    
    await loadPlans();
  })();

  //             console.log('[SW] Nueva versión disponible');

  //       });
  //     })

  //     });
  // } else {

  initThemeToggle();
</script>
