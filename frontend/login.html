<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CoworkHub" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
<title>CoWork Hub - Ingresar</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="brand">CoworkHub</div>
  <nav id="nav"></nav>
  <button id="themeToggle" class="theme-toggle">
    <img src="img/claro.png" alt="Modo claro" />
  </button>
</header>
<main>
  <div class="card" style="max-width:440px; margin: var(--space-12) auto 0; padding: var(--space-8);">
    <div style="text-align: center; margin-bottom: var(--space-8);">
      <h1 style="font-size: 2rem; color: var(--text-primary); margin-bottom: var(--space-3);">CoworkHub</h1>
      <p style="color: var(--text-secondary); font-size: 1rem; margin: 0;">Gestión de espacios de coworking</p>
    </div>
    
    <div class="tabs">
      <button class="tab active" id="tabLogin">Iniciar sesión</button>
      <button class="tab" id="tabRegister">Registrarme</button>
    </div>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div>
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" required placeholder="tu@correo.com" />
      </div>
      <div>
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required placeholder="••••••" />
      </div>
      <button type="submit" style="margin-top: var(--space-2);">Entrar</button>
    </form>

    <form id="registerForm" style="display:none;">
      <div>
        <label>Nombre completo</label>
        <input type="text" id="regName" required placeholder="Tu nombre" />
        <span class="field-error" id="regNameError"></span>
      </div>
      <div>
        <label>Correo electrónico</label>
        <input type="email" id="regEmail" required placeholder="tu@correo.com" />
        <span class="field-error" id="regEmailError"></span>
      </div>
      <div>
        <label>Contraseña (min. 8 caracteres)</label>
        <input type="password" id="regPassword" required minlength="8" placeholder="••••••••" />
        <span class="field-error" id="regPasswordError"></span>
      </div>
      <button type="submit" style="margin-top: var(--space-2);">Crear cuenta</button>
    </form>

    <div style="margin-top: var(--space-8); padding-top: var(--space-6); border-top: 1px solid var(--border-color);">
      <p style="color:var(--text-muted); font-size:0.8125rem; margin: 0; text-align: center;">
        <strong>Datos de prueba:</strong><br>
        admin@coworkhub.test / Admin1234!<br>
        ana@coworkhub.test / Miembro1234!
      </p>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  window.PAGE = 'login';
  const alertBox = document.getElementById('alertBox');
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    loginForm.style.display = 'flex'; registerForm.style.display = 'none';
    clearAlert(alertBox);
  });
  tabRegister.addEventListener('click', () => {
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    registerForm.style.display = 'flex'; loginForm.style.display = 'none';
    clearAlert(alertBox);
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);
    try {
      const user = await api.login({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value,
      });
      
      // Redirigir según rol (la verificación de plan se hará en la página destino)
      if (user.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    } catch (err) {
      showAlert(alertBox, err.message || 'No se pudo iniciar sesion.');
    }
  });

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);
    
    // Validación en tiempo real antes de enviar
    const nameInput = document.getElementById('regName');
    const emailInput = document.getElementById('regEmail');
    const passwordInput = document.getElementById('regPassword');
    
    let hasErrors = false;
    
    // Validar nombre
    if (!nameInput.value.trim()) {
      document.getElementById('regNameError').textContent = 'El nombre es requerido';
      nameInput.classList.add('error');
      hasErrors = true;
    } else if (nameInput.value.trim().length < 2) {
      document.getElementById('regNameError').textContent = 'El nombre debe tener al menos 2 caracteres';
      nameInput.classList.add('error');
      hasErrors = true;
    } else {
      document.getElementById('regNameError').textContent = '';
      nameInput.classList.remove('error');
    }
    
    // Validar email
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailInput.value.trim()) {
      document.getElementById('regEmailError').textContent = 'El correo es requerido';
      emailInput.classList.add('error');
      hasErrors = true;
    } else if (!emailRegex.test(emailInput.value.trim())) {
      document.getElementById('regEmailError').textContent = 'Ingresa un correo válido';
      emailInput.classList.add('error');
      hasErrors = true;
    } else {
      document.getElementById('regEmailError').textContent = '';
      emailInput.classList.remove('error');
    }
    
    // Validar contraseña
    if (!passwordInput.value) {
      document.getElementById('regPasswordError').textContent = 'La contraseña es requerida';
      passwordInput.classList.add('error');
      hasErrors = true;
    } else if (passwordInput.value.length < 8) {
      document.getElementById('regPasswordError').textContent = 'La contraseña debe tener al menos 8 caracteres';
      passwordInput.classList.add('error');
      hasErrors = true;
    } else {
      document.getElementById('regPasswordError').textContent = '';
      passwordInput.classList.remove('error');
    }
    
    if (hasErrors) {
      showAlert(alertBox, 'Por favor corrige los errores antes de continuar.');
      return;
    }
    
    try {
      await api.register({
        name: nameInput.value.trim(),
        email: emailInput.value.trim(),
        password: passwordInput.value,
      });
      showAlert(alertBox, 'Cuenta creada. Redirigiendo a selección de plan...', 'success');
      setTimeout(() => {
        window.location.href = 'select-plan.html';
      }, 1000);
    } catch (err) {
      showAlert(alertBox, err.message || 'No se pudo registrar.');
    }
  });
  
  // Validación en tiempo real al escribir
  document.getElementById('regName').addEventListener('input', function() {
    const errorSpan = document.getElementById('regNameError');
    if (this.value.trim().length >= 2) {
      errorSpan.textContent = '';
      this.classList.remove('error');
    }
  });
  
  document.getElementById('regEmail').addEventListener('input', function() {
    const errorSpan = document.getElementById('regEmailError');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (emailRegex.test(this.value.trim())) {
      errorSpan.textContent = '';
      this.classList.remove('error');
    }
  });
  
  document.getElementById('regPassword').addEventListener('input', function() {
    const errorSpan = document.getElementById('regPasswordError');
    if (this.value.length >= 8) {
      errorSpan.textContent = '';
      this.classList.remove('error');
    }
  });

  renderNav(null);
  initThemeToggle();
  
  // Registro mejorado de service worker para iOS
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
      .then((registration) => {
        console.log('[SW] Service Worker registrado:', registration.scope);
        
        if (registration.waiting) {
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[SW] Nueva versión disponible');
            }
          });
        });
      })
      .catch((err) => {
        console.error('[SW] Error registrando service worker:', err);
      });
  } else {
    console.warn('[SW] Service Worker no soportado en este navegador');
  }

</script>
</body>
</html>
