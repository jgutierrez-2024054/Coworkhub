version: "3.9"
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_coworkhub
      POSTGRES_USER: coworkhub
      POSTGRES_PASSWORD: Admin123COW
    ports:
      - "5436:5432"   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: data_coworkhub
      DB_USER: coworkhub
      DB_PASSWORD: Admin123COW
      JWT_SECRET: Admin123COW
      JWT_EXPIRES_IN: 8h
      COOKIE_NAME: cwh_session
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

volumes:
  postgres_data:
